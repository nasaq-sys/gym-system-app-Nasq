<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nasaq Gym — الموقع متوقف مؤقتاً</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0e0e0e" />
<style>
  :root {
    --background: #0e0e0e;
    --card: #161616;
    --border: #2a2a30;
    --foreground: #ffffff;
    --muted: #8e8e93;
    --accent: #2563EB;
    --accent-foreground: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .logo-text {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  .logo-text .white { color: var(--foreground); }
  .logo-text .accent { color: var(--accent); }

  .icon-circle {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 20px;
    background: rgba(232, 98, 44, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-circle svg {
    width: 30px;
    height: 30px;
    stroke: var(--accent);
  }

  h1 {
    font-size: 19px;
    font-weight: 800;
    margin: 0 0 10px;
    color: var(--foreground);
  }

  p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0;
  }

  p + p {
    margin-top: 8px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  .social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .social a {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  .social a:hover {
    color: var(--accent);
    background: rgba(232, 98, 44, 0.1);
  }

  .social svg {
    width: 17px;
    height: 17px;
    fill: currentColor;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: #6b6b70;
    margin-top: 20px;
  }

  .footer a {
    color: inherit;
    text-decoration: none;
  }

  .footer a:hover {
    color: var(--accent);
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div>
    <div class="card">
      <div class="logo-text"><span class="white">Nasaq </span><span class="accent">Gym</span></div>

      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>

      <h1>الموقع متوقف مؤقتاً</h1>
      <p>نقوم حالياً بأعمال صيانة طارئة لتحسين تجربتكم على الموقع.</p>
      <p>سنعود خلال وقت قصير، شكراً لصبركم.</p>

      <div class="divider"></div>

      <div class="social">
        <a href="https://www.instagram.com/ultragym.jo/?hl=ar" target="_blank" rel="noopener noreferrer" aria-label="Instagram">

        </a>
        <a href="https://www.facebook.com/UltraGymJo/?locale=ar_AR" target="_blank" rel="noopener noreferrer" aria-label="Facebook">

      </div>
    </div>

    <p class="footer">© <a href="https://nasaqjo.com/" target="_blank" rel="noopener noreferrer">2026 By Nasaq</a></p>
  </div>

</body>
</html>
