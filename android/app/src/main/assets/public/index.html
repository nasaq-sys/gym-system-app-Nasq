<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nasaq Gym</title>
  <meta name="theme-color" content="#0e0e0e">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0e0e0e;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
    }
    .logo-img {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(37, 99, 235, 0.35);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title .text-light {
      color: #ffffff;
    }
    .brand-title .text-primary {
      color: #3b82f6;
    }
    .subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 8px;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.04);
        opacity: 0.9;
      }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <img src="/icon-192.png" alt="Nasaq Gym" class="logo-img" />
    <div class="brand-title">
      <span class="text-light">Nasaq</span>
      <span class="text-primary">Gym</span>
    </div>
    <div class="subtitle">نسق جيم الرياضي</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
